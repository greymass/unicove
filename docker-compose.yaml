version: '3.8'
services:
  nginx:
    image: nginx:latest
    depends_on:
      - sveltekit
    networks:
      - unicove
    ports:
      - '8000:8000'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - assets:/srv/assets/_app/immutable:ro
  sveltekit:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - '3000'
    networks:
      - unicove
    restart: always
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - assets:/assets

networks:
  unicove:

volumes:
  assets:
